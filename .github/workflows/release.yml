name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build and attach the plugin ZIP
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A tag that disagrees with the plugin header would ship a plugin that
      # reports the wrong version, and every updater reads the header.
      - name: Check the tag matches the plugin header
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header="$(sed -n 's/^ \* Version:[[:space:]]*//p' livetickr.php | head -1 | tr -d '[:space:]')"
          echo "tag=$tag header=$header"
          if [ "$tag" != "$header" ]; then
            echo "::error::Tag $tag does not match the Version header ($header)."
            exit 1
          fi
          stable="$(sed -n 's/^Stable tag:[[:space:]]*//p' readme.txt | head -1 | tr -d '[:space:]')"
          if [ "$tag" != "$stable" ]; then
            echo "::error::Tag $tag does not match readme.txt Stable tag ($stable)."
            exit 1
          fi

      # The ZIP has to unpack to a directory named after the plugin slug, which
      # is also the text domain, so translations keep resolving.
      - name: Build the ZIP
        run: |
          mkdir -p build/livetickr
          tar --exclude-from=.distignore -cf - . | tar -C build/livetickr -xf -
          ( cd build && zip -rq ../livetickr.zip livetickr )
          unzip -l livetickr.zip

      - name: Attach it to the release
        uses: softprops/action-gh-release@v2
        with:
          files: livetickr.zip
          generate_release_notes: true
